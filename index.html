<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>輕鐵 & 屯馬綫 到站時間</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Noto Sans HK,sans-serif}
body{background:#f3f4f6;padding:12px}
.mtr-header{background:#003663;color:white;padding:14px;border-radius:10px;margin-bottom:12px;font-size:18px;font-weight:bold}
.station-card{background:white;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.station-title{font-size:16px;font-weight:bold;margin-bottom:8px}
.lr{color:#b81028}
.tml{color:#92278f}
.dir-label{font-weight:bold;margin:8px 0 4px;color:#444}
.arrival-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
.platform{color:#666;font-size:14px}
.time-badge{font-weight:bold}
.loading{color:#666;padding:10px}
.error{color:red;padding:10px}
.refresh-bar{text-align:center;margin:10px 0;color:#555;font-size:14px}
</style>
</head>
<body>
<div class="mtr-header">🚇 輕鐵｜屯馬綫 到站預報</div>
<div class="refresh-bar">自動更新｜每30秒重新載入</div>
<div id="container"></div>

<script>
// ===================== 👉【淨係改下面呢一行！】=====================
const WORKER_URL = "https://mtr-proxy.idyl-2014061.workers.dev/";
// =================================================================
const container = document.getElementById("container");

// 車站清單
const stations = [
  {id:"TUM",name:"屯馬綫｜屯門站",type:"tml"},
  {id:"TIS",name:"屯馬綫｜天水圍站",type:"tml"},
  {id:"LOP",name:"屯馬綫｜朗屏站",type:"tml"},
  {id:"YUL",name:"屯馬綫｜元朗站",type:"tml"},
  {id:"LR1027",name:"輕鐵｜天水圍站",type:"lr"},
  {id:"LR1017",name:"輕鐵｜天榮站",type:"lr"},
  {id:"LR1044",name:"輕鐵｜豐年路站",type:"lr"},
  {id:"LR1045",name:"輕鐵｜元朗站",type:"lr"},
];

// 目的地簡寫轉中文
function destName(code){
  const map = {
    "TUM":"屯門",
    "WKS":"烏溪沙"
  }
  return map[code] || code;
}

function render(data){
  container.innerHTML = "";
  stations.forEach(s=>{
    const card = document.createElement("div");
    card.className = "station-card";
    const title = document.createElement("div");
    title.className = `station-title ${s.type}`;
    title.innerText = s.name;
    card.appendChild(title);

    const raw = data[s.id];
    if(!raw){
      card.innerHTML += `<div class="error">資料讀取失敗</div>`;
      container.appendChild(card);
      return;
    }

    // -------- 屯馬綫 TML 處理 --------
    if(s.type === "tml"){
      if(raw.status !== 1){
        card.innerHTML += `<div class="loading">暫無班次</div>`;
        container.appendChild(card);
        return;
      }
      const stationKey = Object.keys(raw.data)[0];
      const info = raw.data[stationKey];

      // UP方向
      if(info.UP && info.UP.length>0){
        card.innerHTML += `<div class="dir-label">↑ UP方向</div>`;
        info.UP.forEach(item=>{
          if(item.valid !== "Y") return;
          card.innerHTML += `
            <div class="arrival-item">
              <span>${destName(item.dest)} <span class="platform">(月台${item.plat})</span></span>
              <span class="time-badge">${item.ttnt} 分鐘</span>
            </div>`;
        })
      }
      // DOWN方向
      if(info.DOWN && info.DOWN.length>0){
        card.innerHTML += `<div class="dir-label">↓ DOWN方向</div>`;
        info.DOWN.forEach(item=>{
          if(item.valid !== "Y") return;
          card.innerHTML += `
            <div class="arrival-item">
              <span>${destName(item.dest)} <span class="platform">(月台${item.plat})</span></span>
              <span class="time-badge">${item.ttnt} 分鐘</span>
            </div>`;
        })
      }
    }

    // -------- 輕鐵 LR 處理 --------
    if(s.type === "lr"){
      if(raw.status !== 0 || !raw.schedule){
        card.innerHTML += `<div class="loading">輕鐵：暫無到站資料（可能已收車）</div>`;
      }else{
        raw.schedule.forEach(item=>{
          card.innerHTML += `
            <div class="arrival-item">
              <span>${item.dest}</span>
              <span class="time-badge">${item.time}</span>
            </div>`;
        })
      }
    }
    container.appendChild(card);
  })
}

async function fetchData(){
  container.innerHTML = `<div class="loading">載入緊港鐵資料…</div>`;
  try{
    const res = await fetch(WORKER_URL);
    const json = await res.json();
    render(json);
  }catch(e){
    container.innerHTML = `<div class="error">載入失敗，請稍後再試</div>`;
    console.error(e);
  }
}
fetchData();
setInterval(fetchData,30000);
</script>
</body>
</html>
